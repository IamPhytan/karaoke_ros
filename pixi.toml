[workspace]
name = "karaoke_ros"
version = "0.1.0"
authors = ["Damien LaRocque <phicoltan@gmail.com>"]
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
ros-humble-karaoke-interfaces = { path = "karaoke_interfaces" }
ros-humble-karaoke-ros = { path = "karaoke_ros" }
ros-humble-desktop = "*"
pygame = "*"

[tasks]
launch = { cmd = "ros2 launch karaoke_ros karaoke.launch.py" }
