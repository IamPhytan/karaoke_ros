[workspace]
name = "karaoke_ros"
version = "0.1.0"
authors = ["Damien LaRocque <phicoltan@gmail.com>"]
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
setuptools = "*"
compilers = ">=2.0.0,<3"
pkg-config = ">=0.29.2,<0.30"
cmake = "<4"
ninja = ">=1.13.2,<2"
pygame = "*"
empy = "<4"

[activation]
scripts = ["../../install/setup.sh"]

[tasks]
build = { cmd = "colcon build --symlink-install", cwd = "../../", inputs = [
    "../../src",
] }
launch = { cmd = "ros2 launch karaoke_ros karaoke.launch.py", depends-on = [
    "build",
] }
